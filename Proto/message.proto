syntax = "proto3";
option csharp_namespace = "GameProto";

message CSInput {
    int32 player_id = 1;
    float move_x = 2;
    float move_z = 3;
    int32 action_type = 4;
    float rotation_y = 5;
}

message SCFrame {
    int32 frame_id = 1;
    repeated CSInput inputs = 2;
}

message CSChat {
    int32 player_id = 1;
    string message = 2;
}

message CSRoomJoin {
    int32 player_id = 1;
    string room_id = 2;
}